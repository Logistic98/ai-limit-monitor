services:
  ai-limit-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-limit-monitor:latest
    container_name: ai-limit-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - monitor-state:/data
      - claude-auth:/root/.claude
      - codex-auth:/root/.codex
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          read -r children < /proc/1/task/1/children;
          for pid in $$children; do
            [ "$$pid" = "$$$$" ] && continue;
            grep -aq '/app/.venv/bin/ai-limit-monitor' "/proc/$$pid/cmdline" && exit 0;
          done;
          exit 1
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  monitor-state:
  claude-auth:
  codex-auth:
